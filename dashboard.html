<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM OS | Multiverse Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@700;900&display=swap');

        :root {
            --bg-dark: #050505;
            --header-bg: #000000;
            --border-color: #333333;
            --accent-main: #ffffff;
            --accent-muted: #888888;
        }
        /* ═══ GLOBAL LIGHT MODE OVERRIDE ═════════════════════════ */
        body.light-mode {
            --bg-dark: #f0f2f5;       /* Light grey background */
            --header-bg: #ffffff;     /* Solid white header */
            --border-color: #d1d5db;  /* Visible grey borders */
            --accent-main: #000000;   /* Black text and accents */
            --accent-muted: #6b7280;  /* Dark grey for muted text */
            --panel-bg: rgba(255, 255, 255, 0.85); /* Light glass panel */
        }

        /* Invert the animated grid lines to dark mode */
        body.light-mode .omni-bg {
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.07) 1px, transparent 1px);
        }

        /* Ensure the input text flips to black */
        body.light-mode .omnibar {
            color: #000000;
        }

        /* Update hover effects for the Hub Cards in light mode */
        body.light-mode .hub-card {
            background: rgba(255, 255, 255, 0.6);
        }
        body.light-mode .hub-card:hover {
            background: var(--accent-main);
            color: #ffffff;
        }
        body.light-mode .hub-card:hover .hub-num, 
        body.light-mode .hub-card:hover .hub-desc {
            color: #ffffff;
        }
        /* Fix the dashboard button colors in Light Mode */
        body.light-mode #dashboardThemeBtn {
            color: var(--accent-main);
            border-color: var(--accent-main);
        }
        body.light-mode #dashboardThemeBtn:hover {
            background-color: var(--accent-main);
            color: var(--header-bg);
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg-dark); color: var(--accent-main);
            font-family: 'JetBrains Mono', monospace;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .glass-header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            padding: 0 20px;
            height: 58px;
            gap: 16px;
            z-index: 10;
            flex-shrink: 0;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px; font-weight: 900; letter-spacing: 3px;
            color: var(--accent-main); text-decoration: none; cursor: pointer;
            white-space: nowrap;
        }

        .omnibar-wrap {
            display: flex; align-items: center;
            background: var(--bg-dark); border: 1px solid var(--border-color);
            height: 34px; transition: border-color 0.2s;
        }
        .omnibar-wrap:focus-within {
            border-color: var(--accent-main);
            box-shadow: 0 0 10px rgba(255,255,255,0.07);
        }
        .omnibar-prefix {
            padding: 0 10px; color: var(--accent-muted); font-size: 10px;
            font-weight: bold; border-right: 1px solid var(--border-color);
            height: 100%; display: flex; align-items: center; white-space: nowrap;
        }
        .omnibar {
            flex: 1; background: transparent; border: none; color: var(--accent-main);
            padding: 0 12px; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; outline: none; min-width: 0;
        }
        .omnibar::placeholder { color: var(--accent-muted); }

        .header-right {
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
        }

        /* Heartbeat status dot */
        @keyframes heartbeat {
            0%   { transform: scale(1);   box-shadow: 0 0 0 0 rgba(0,229,117,0); }
            15%  { transform: scale(1.6); box-shadow: 0 0 10px 3px rgba(0,229,117,0.7); }
            30%  { transform: scale(0.9); box-shadow: 0 0 5px 1px rgba(0,229,117,0.3); }
            45%  { transform: scale(1.35);box-shadow: 0 0 14px 4px rgba(0,229,117,0.55); }
            70%  { transform: scale(1);   box-shadow: 0 0 4px 1px rgba(0,229,117,0.15); }
            100% { transform: scale(1);   box-shadow: 0 0 0 0 rgba(0,229,117,0); }
        }
        .status-dot {
            width: 7px; height: 7px; background: #00e575; border-radius: 50%;
            display: inline-block; animation: heartbeat 2.4s ease-in-out infinite;
            flex-shrink: 0;
        }

        .viewport-container { flex: 1; position: relative; overflow: hidden; }

        iframe {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: none; background: var(--bg-dark);
        }

        /* Vault overlay */
        .vault-overlay {
            display: none; position: absolute; inset: 0; z-index: 20;
            flex-direction: column; align-items: center; justify-content: center;
            background: rgba(5,5,5,0.96); backdrop-filter: blur(12px);
            text-align: center; padding: 20px;
        }
        .vault-box {
            border: 1px solid var(--border-color); background: #000;
            padding: 40px; max-width: 580px; width: 100%;
            box-shadow: 0 0 50px rgba(255,255,255,0.04);
        }
        /* ═══ MOBILE RESPONSIVE ENGINE ══════════════════════════ */
        @media (max-width: 768px) {
            /* Restructure Header to 2-Row Layout */
            .glass-header {
                grid-template-columns: 1fr auto; 
                grid-template-rows: auto auto;   
                height: auto;
                padding: 12px 16px;
                gap: 12px;
            }
            .brand-title {
                grid-column: 1 / 2;
                font-size: 15px;
                letter-spacing: 2px;
            }
            .header-right {
                grid-column: 2 / 3;
            }
            /* Expand FNS Routing Bar to Full Width */
            .omnibar-wrap {
                grid-column: 1 / 3; 
                height: 40px;
            }
            .omnibar-prefix {
                font-size: 9px;
                padding: 0 10px;
            }
            .omnibar {
                font-size: 11px;
            }
            /* Override inline Tailwind for mobile button */
            #dashboardThemeBtn {
                font-size: 9px !important;
                padding: 6px 10px !important;
            }
            /* Snap Mother AI Terminal to Mobile Viewport */
            #aiPanel {
                width: 100% !important;
                max-width: 100vw !important;
                right: 0 !important;
                border-left: none;
                border-right: none;
            }
            /* Scale Down the Vault Alert Box */
            .vault-box {
                padding: 25px;
                margin: 15px;
                width: calc(100% - 30px);
            }
            .vault-box .text-3xl {
                font-size: 1.5rem;
                line-height: 2rem;
            }
        }
    </style>
</head>
<body>
    <header class="glass-header">
        <a href="#" onclick="showHub(); return false;" class="brand-title">BOM OS</a>

        <div class="omnibar-wrap">
            <div class="omnibar-prefix">ROUTE></div>
            <input type="text" id="omnibar" class="omnibar"
                placeholder="ENTER DOTLESS FNS NAMESPACE..." autocomplete="off" spellcheck="false">
        </div>

        <div class="header-right text-[10px] text-gray-400 font-bold uppercase tracking-widest">
            <span class="status-dot"></span>
            <span class="hidden sm:inline">[ EVM SYNCED ]</span>
            <button id="dashboardThemeBtn" class="text-[11px] uppercase font-bold text-white bg-transparent border border-[#333] hover:bg-white hover:text-black px-3 py-1.5 transition cursor-pointer">
    [ LIGHT MODE ]
</button>
        </div>
    </header>

    <main class="viewport-container">
        <!-- iframe defaults to hub.html — the animated launcher page -->
        <iframe id="contentFrame" src="" allowfullscreen></iframe>
        <script>(function(){var p=sessionStorage.getItem('bom_last_page');document.getElementById('contentFrame').src=p||'hub.html';})();</script>

        <!-- IPFS Vault overlay -->
        <div id="vaultOverlay" class="vault-overlay">
            <div class="vault-box">
                <div class="text-3xl mb-4 font-black orbitron tracking-widest">[ 01 ]</div>
                <h2 class="text-lg font-black tracking-widest mb-2 uppercase">[ SOVEREIGN VAULT DETECTED ]</h2>
                <p class="text-xs text-gray-400 leading-relaxed mt-2 max-w-md mx-auto">
                    This namespace resolves to a decentralized IPFS vault. Cross-origin iframe rendering is restricted.
                </p>
                <div class="mt-8 p-4 border border-[#333] bg-[#050505] text-left">
                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-2 border-b border-[#333] pb-2">[ CRYPTOGRAPHIC ROUTING ANCHOR ]</div>
                    <div class="text-xs text-white break-all mt-2 font-mono" id="vaultCID">ipfs://...</div>
                </div>
                <a href="#" target="_blank" id="btnOpenVault"
                   class="inline-block mt-6 px-6 py-3 bg-white text-black font-bold text-xs uppercase tracking-widest border border-white hover:bg-transparent hover:text-white transition decoration-none">
                    [ BREACH VAULT (EXTERNAL) ↗ ]
                </a>
                <div class="mt-6">
                    <button onclick="showHub()" class="text-[10px] text-gray-500 hover:text-white underline uppercase tracking-widest bg-transparent border-none cursor-pointer">
                        [ RETURN TO HUB ]
                    </button>
                </div>
            </div>
        </div>
    
        <!-- MOTHER AI COMMAND PANEL — visible after wallet connect -->
        <div id="aiPanel" style="
            display: none;
            position: absolute; bottom: 0; right: 24px;
            width: 520px; max-width: calc(100vw - 48px);
            flex-direction: column;
            background: rgba(0,0,0,0.96);
            border: 1px solid #2a2a2a;
            border-bottom: none;
            backdrop-filter: blur(20px);
            z-index: 30;
            transform: translateY(calc(100% - 44px));
            transition: transform 0.35s cubic-bezier(0.19,1,0.22,1);
            font-family: 'JetBrains Mono', monospace;
        ">
            <!-- Panel header / drag handle -->
            <div onclick="toggleAIPanel()" style="
                height: 44px; display: flex; align-items: center; justify-content: space-between;
                padding: 0 16px; border-bottom: 1px solid #222; cursor: pointer;
                user-select: none; flex-shrink: 0;
            ">
                <span style="font-size:10px;font-weight:bold;letter-spacing:2px;color:#00e575;text-transform:uppercase;">
                    ▲ MOTHER AI — COMMAND INTERFACE
                </span>
                <span id="aiToggleIcon" style="font-size:9px;color:#555;letter-spacing:1px;">[ EXPAND ]</span>
            </div>
            <!-- Output log -->
            <div id="aiOutput" style="
                flex: 1; height: 220px; overflow-y: auto;
                padding: 12px 16px; font-size:11px; line-height:1.7;
                color:#888; scrollbar-width: thin; scrollbar-color: #333 transparent;
            "></div>
            <!-- Command input -->
            <div style="border-top:1px solid #1a1a1a; display:flex; align-items:center; height:38px; flex-shrink:0;">
                <span style="padding:0 12px;color:#555;font-size:10px;font-weight:bold;border-right:1px solid #1a1a1a;height:100%;display:flex;align-items:center;white-space:nowrap;">CMD&gt;</span>
                <input id="aiInput" type="text" autocomplete="off" spellcheck="false"
                    placeholder="show all | search NAME | resolve NAME | help"
                    style="flex:1;background:transparent;border:none;color:#fff;padding:0 12px;
                           font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;">
            </div>
        </div>
    </main>

            <script>
        // ── CONSTANTS ──────────────────────────────────────────────
        const CONTRACT_ADDRESS = "0x9Dd6f41235a3f6D2dcF9a73B5177c14e721432Ff";
        const CONTRACT_ABI     = [
            "function resolveFNS(string targetString) view returns (address owner, string spatialURI)",
            "function owner() view returns (address)"
        ];
        const RPC_URL          = "https://ethereum-sepolia-rpc.publicnode.com";
        const OVERMIND_NODES   = [
            'https://web-production-d64b0.up.railway.app',
            'https://bom-overmind-backend.onrender.com'
        ];
        let OVERMIND_API = null;

        // Status tag pattern — stripped on focus
        // Strips any bracketed status prefix — handles multi-word tags like [UNCLAIMED — NOT MINTED]
        const STATUS_TAG_RE = /^\[[^\]]*\][\s\u2014-]*/;

        // DOM refs
        const omnibar      = document.getElementById('omnibar');
        const contentFrame = document.getElementById('contentFrame');
        const vaultOverlay = document.getElementById('vaultOverlay');
        const walletBtn    = document.getElementById('walletBtn');
        const aiPanel      = document.getElementById('aiPanel');
        const aiOutput     = document.getElementById('aiOutput');
        const aiInput      = document.getElementById('aiInput');

        // ── OVERMIND PROBE ──────────────────────────────────────────
        async function probeOvermind() {
            for (const node of OVERMIND_NODES) {
                try {
                    const r = await fetch(node + '/api/health', { signal: AbortSignal.timeout(3500) });
                    if (r.ok) { OVERMIND_API = node; return node; }
                } catch {}
            }
            return null;
        }
        probeOvermind();

        // ── OMNIBAR FOCUS: strip stale tags ────────────────────────
        omnibar.addEventListener('focus', function() {
            this.value = this.value.replace(STATUS_TAG_RE, '').trim();
        });

        // ── PUBLIC: called by hub.html via window.parent ────────────
        function launchApp(url) {
            vaultOverlay.style.display = 'none';
            contentFrame.src = url;
            sessionStorage.setItem('bom_last_page', url);
        }

        function showHub() {
            vaultOverlay.style.display = 'none';
            contentFrame.src = 'hub.html';
            sessionStorage.removeItem('bom_last_page');
            omnibar.value = '';
            omnibar.disabled = false;
        }

        function showVault(cid, gatewayURL) {
            document.getElementById('vaultCID').innerText = cid;
            document.getElementById('btnOpenVault').href = gatewayURL;
            vaultOverlay.style.display = 'flex';
        }

        function toggleThemeFromChild(isLight) {
            document.body.style.background = isLight ? '#f0f0f5' : '';
        }

        // ── RESOLUTION ENGINE — 4-TIER ──────────────────────────────
        // IMPORTANT: Dotless strings ALWAYS go on-chain.
        //            No shortcut table. No local guessing.
        async function resolveAndLoad(raw) {
            const trimmed = raw.trim();
            if (!trimmed) return;
            const lower = trimmed.toLowerCase();

            // TIER 0: Full URL
            if (lower.startsWith('http://') || lower.startsWith('https://')) {
                launchApp(trimmed); return;
            }

            // TIER 1: Explicit .html local file
            if (lower.endsWith('.html')) {
                launchApp(trimmed); return;
            }

            // TIER 2: Has a dot but not .html → external domain
            if (trimmed.includes('.') && !lower.endsWith('.html')) {
                launchApp('https://' + trimmed); return;
            }

            // TIER 3 (ONLY TIER FOR DOTLESS): On-chain EVM resolution
            // Never assume local file for dotless names — always check blockchain first
            const query = lower;
            omnibar.value = '[QUERYING EVM]: ' + query.toUpperCase() + '...';
            omnibar.disabled = true;

            try {
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
                const [owner, spatialURI] = await contract.resolveFNS(query);

                if (owner === ethers.ZeroAddress) {
                    // Unclaimed: show in omnibar, let user mint (clean standard tag)
                    omnibar.value = query.toUpperCase() + ' [UNCLAIMED — NOT MINTED]';
                    launchApp('fns.html?mint=' + encodeURIComponent(query));
                } else {
                    omnibar.value = '[SECURED] ' + query.toUpperCase();
                    const uri = (spatialURI || '').trim();

                    if (!uri) {
                        // Claimed but no spatial URI set yet
                        launchApp('fns.html?resolve=' + encodeURIComponent(query));
                    } else if (uri.startsWith('ipfs://')) {
                        // IPFS vault
                        showVault(uri, 'https://ipfs.io/ipfs/' + uri.replace('ipfs://', ''));
                    } else {
                        // Load exactly as stored — the user set this URI intentionally.
                        launchApp(uri);
                    }
                }
            } catch (err) {
                console.error('[FNS]', err.message);
                omnibar.value = '[EVM ERROR] CONNECTION FAILED — RETRY';
                setTimeout(() => { omnibar.value = ''; }, 3000);
            } finally {
                omnibar.disabled = false;
            }
        }

        // ═══ BULLETPROOF OMNIBAR LISTENERS ═══════════════════════
        // Auto-clean any bracketed tag on focus/click
        omnibar.addEventListener('focus', function() {
            this.value = this.value.replace(/\[.*?\]/g, '').trim();
        });

        // Universal strip on Enter key (catches ANY text inside [...])
        omnibar.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            
            const clean = this.value.replace(/\[.*?\]/g, '').trim();
            if (clean) {
                this.value = clean; // visually resets the bar
                resolveAndLoad(clean);
            }
        });

        // ══════════════════════════════════════════════════════════
        //  WALLET CONNECT + MOTHER AI COMMAND PANEL
        // ══════════════════════════════════════════════════════════
        let connectedAddress = null;
        let aiPanelOpen = false;

        async function connectWallet() {
            if (!window.ethereum) {
                walletBtn.textContent = '[ NO WALLET DETECTED ]';
                setTimeout(() => { walletBtn.textContent = '[ CONNECT WALLET ]'; }, 2500);
                return;
            }
            try {
                walletBtn.textContent = '[ CONNECTING... ]';
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                connectedAddress = accounts[0];
                const short = connectedAddress.slice(0, 6) + '...' + connectedAddress.slice(-4);
                walletBtn.textContent = '[ ' + short.toUpperCase() + ' ]';
                walletBtn.style.color = '#00e575';
                walletBtn.style.borderColor = '#00e575';
                walletBtn.onclick = toggleAIPanel;

                // ── OWNER CHECK: only show Mother AI panel to contract owner ──
                try {
                    const provider = new ethers.JsonRpcProvider(RPC_URL);
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
                    const contractOwner = await contract.owner();
                    const isOwner = contractOwner.toLowerCase() === connectedAddress.toLowerCase();

                    if (isOwner) {
                        aiPanel.style.display = 'flex';
                        aiLog('[MOTHER AI] OWNER AUTHENTICATED: ' + short.toUpperCase(), 'sys');
                        aiLog('[MOTHER AI] COMMANDS: show all | search NAME | resolve NAME | clear | help', 'sys');
                    } else {
                        // Non-owner wallet: connected but no command panel
                        aiLog && null; // panel stays hidden
                        walletBtn.title = 'Connected as viewer — command panel restricted to protocol owner';
                    }
                } catch (ownerErr) {
                    // If owner() call fails, deny panel access for safety
                    console.warn('[WALLET] Owner check failed:', ownerErr.message);
                }
            } catch (err) {
                walletBtn.textContent = '[ CONNECT WALLET ]';
                console.error('[WALLET]', err.message);
            }
        }

        function toggleAIPanel() {
            aiPanelOpen = !aiPanelOpen;
            aiPanel.style.transform = aiPanelOpen ? 'translateY(0)' : 'translateY(calc(100% - 44px))';
        }

        function aiLog(text, type = 'out') {
            const line = document.createElement('div');
            line.style.cssText = 'font-size:11px;line-height:1.8;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.04);word-break:break-all;';
            line.style.color = type === 'sys' ? '#00e575' : type === 'err' ? '#ff4444' : type === 'in' ? '#aaaaaa' : '#ffffff';
            line.textContent = text;
            aiOutput.appendChild(line);
            aiOutput.scrollTop = aiOutput.scrollHeight;
        }

        function aiClear() {
            aiOutput.innerHTML = '';
            aiLog('[MOTHER AI] TERMINAL CLEARED.', 'sys');
        }

        // Render a table of FNS records in the AI output panel
        function renderRecords(records) {
            if (!records || records.length === 0) {
                aiLog('[RESULT] NO RECORDS FOUND IN OVERMIND INDEX.', 'err'); return;
            }
            aiLog('─'.repeat(48), 'sys');
            aiLog('  NAMESPACE           STATUS    SPATIAL URI', 'sys');
            aiLog('─'.repeat(48), 'sys');
            records.forEach(r => {
                const ns  = (r.namespace  || '—').toUpperCase().padEnd(20);
                const st  = (r.status     || '?').toUpperCase().padEnd(10);
                const uri = r.spatialURI  || r.spatial_uri || '[ UNROUTED ]';
                aiLog(ns + st + uri, 'out');
            });
            aiLog('─'.repeat(48), 'sys');
            aiLog('[RESULT] ' + records.length + ' RECORD(S) RETURNED.', 'sys');
        }

        // Clickable record: loads the spatial URI into iframe
        function renderClickableRecords(records) {
            if (!records || records.length === 0) {
                aiLog('[RESULT] NO RECORDS FOUND.', 'err'); return;
            }
            aiLog('─'.repeat(48), 'sys');
            aiLog('  NAMESPACE           SPATIAL URI', 'sys');
            aiLog('─'.repeat(48), 'sys');
            records.forEach(r => {
                const uri = r.spatialURI || r.spatial_uri || '';
                const row = document.createElement('div');
                row.style.cssText = 'display:flex;gap:10px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;';
                row.onmouseenter = () => { row.style.background = 'rgba(255,255,255,0.04)'; };
                row.onmouseleave = () => { row.style.background = 'transparent'; };

                const nsSpan = document.createElement('span');
                nsSpan.style.cssText = 'font-size:11px;color:#ffffff;min-width:160px;font-weight:bold;';
                nsSpan.textContent = (r.namespace || '—').toUpperCase();

                const uriSpan = document.createElement('span');
                uriSpan.style.cssText = 'font-size:10px;color:#888;flex:1;word-break:break-all;';
                uriSpan.textContent = uri || '[ UNROUTED ]';

                if (uri) {
                    const loadBtn = document.createElement('button');
                    loadBtn.textContent = '[ LOAD ]';
                    loadBtn.style.cssText = 'font-family:JetBrains Mono,monospace;font-size:9px;font-weight:bold;background:transparent;border:1px solid #333;color:#aaa;padding:2px 8px;cursor:pointer;white-space:nowrap;transition:all 0.2s;';
                    loadBtn.onmouseenter = () => { loadBtn.style.background='#fff'; loadBtn.style.color='#000'; };
                    loadBtn.onmouseleave = () => { loadBtn.style.background='transparent'; loadBtn.style.color='#aaa'; };
                    loadBtn.onclick = () => {
                        // Use URI exactly as stored — do not add https://
                        resolveAndLoad(uri);
                        aiLog('[CMD] LOADING: ' + (r.namespace||'').toUpperCase() + ' → ' + uri, 'sys');
                    };
                    row.appendChild(nsSpan);
                    row.appendChild(uriSpan);
                    row.appendChild(loadBtn);
                } else {
                    row.appendChild(nsSpan);
                    row.appendChild(uriSpan);
                }
                aiOutput.appendChild(row);
            });
            aiLog('─'.repeat(48), 'sys');
            aiLog('[RESULT] ' + records.length + ' RECORD(S). CLICK [ LOAD ] TO ROUTE INTO IFRAME.', 'sys');
        }

        // Process typed commands in the Mother AI panel
        async function processAICommand(cmd) {
            const c = cmd.trim().toLowerCase();
            if (!c) return;
            aiLog('> ' + cmd.toUpperCase(), 'in');

            if (c === 'clear') { aiClear(); return; }

            if (c === 'show all' || c === 'list' || c === 'ls' || c === 'show names' || c === 'list all') {
                aiLog('[MOTHER AI] QUERYING OVERMIND INDEX...', 'sys');
                if (!OVERMIND_API) await probeOvermind();
                if (!OVERMIND_API) { aiLog('[ERROR] OVERMIND UNREACHABLE — NO CLOUD NODE.', 'err'); return; }
                try {
                    const r = await fetch(OVERMIND_API + '/api/namespaces', { signal: AbortSignal.timeout(5000) });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const data = await r.json();
                    renderClickableRecords(Array.isArray(data) ? data : data.results || []);
                } catch (err) {
                    aiLog('[ERROR] FETCH FAILED: ' + err.message, 'err');
                }
                return;
            }

            if (c.startsWith('search ') || c.startsWith('find ')) {
                const q = cmd.replace(/^(search|find)s+/i, '').trim();
                aiLog('[MOTHER AI] SEARCHING: ' + q.toUpperCase(), 'sys');
                if (!OVERMIND_API) await probeOvermind();
                if (!OVERMIND_API) { aiLog('[ERROR] OVERMIND UNREACHABLE.', 'err'); return; }
                try {
                    const r = await fetch(OVERMIND_API + '/api/search?q=' + encodeURIComponent(q), { signal: AbortSignal.timeout(5000) });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const data = await r.json();
                    renderClickableRecords(data.results || []);
                } catch (err) {
                    aiLog('[ERROR] SEARCH FAILED: ' + err.message, 'err');
                }
                return;
            }

            if (c.startsWith('resolve ')) {
                const ns = cmd.replace(/^resolves+/i, '').trim().toLowerCase();
                aiLog('[MOTHER AI] ON-CHAIN RESOLVE: ' + ns.toUpperCase(), 'sys');
                try {
                    const provider = new ethers.JsonRpcProvider(RPC_URL);
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
                    const [owner, spatialURI] = await contract.resolveFNS(ns);
                    if (owner === ethers.ZeroAddress) {
                        aiLog('[RESULT] ' + ns.toUpperCase() + ' — UNCLAIMED', 'err');
                    } else {
                        aiLog('[RESULT] OWNER:  ' + owner, 'out');
                        aiLog('[RESULT] URI:    ' + (spatialURI || '[ UNROUTED ]'), 'out');
                    }
                } catch (err) {
                    aiLog('[ERROR] EVM CALL FAILED: ' + err.message, 'err');
                }
                return;
            }

            if (c === 'help' || c === '?') {
                aiLog('[COMMANDS]', 'sys');
                aiLog('  show all        — list all indexed FNS records', 'out');
                aiLog('  search NAME     — search Overmind by keyword', 'out');
                aiLog('  resolve NAME    — query on-chain spatial URI', 'out');
                aiLog('  clear           — clear terminal', 'out');
                return;
            }

            aiLog('[UNKNOWN COMMAND] Type HELP for available commands.', 'err');
        }

        aiInput.addEventListener('keypress', function(e) {
            if (e.key !== 'Enter') return;
            const v = this.value.trim();
            this.value = '';
            if (v) processAICommand(v);
        });
                // ═══ THEME SYNC ENGINE (DASHBOARD HUB) ══════════════════════════
const dashThemeBtn = document.getElementById('dashboardThemeBtn');

// 1. Initial Load Memory
if (localStorage.getItem('bom_theme') === 'light') {
    document.body.classList.add('light-mode');
    if (dashThemeBtn) dashThemeBtn.textContent = "[ DARK MODE ]";
} else {
    if (dashThemeBtn) dashThemeBtn.textContent = "[ LIGHT MODE ]";
}

// 2. Outbound: When you click the Dashboard button
if (dashThemeBtn) {
    dashThemeBtn.addEventListener('click', () => {
        const isLight = document.body.classList.toggle('light-mode');
        const newTheme = isLight ? 'light' : 'dark';
        
        // 🚨 THIS IS THE FIX: Bulletproof text swap
        dashThemeBtn.textContent = isLight ? "[ DARK MODE ]" : "[ LIGHT MODE ]";
        
        localStorage.setItem('bom_theme', newTheme); // Save globally
        
        // Shout DOWN to the iframe to change its theme too
        const iframe = document.getElementById('contentFrame');
        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'SYNC_THEME', theme: newTheme }, '*');
        }
    });
}

// 3. Inbound: Listen for clicks coming UP from the 5 pages
window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'SYNC_THEME') {
        const isLight = (event.data.theme === 'light');
        if (isLight) {
            document.body.classList.add('light-mode');
            if (dashThemeBtn) dashThemeBtn.textContent = "[ DARK MODE ]";
        } else {
            document.body.classList.remove('light-mode');
            if (dashThemeBtn) dashThemeBtn.textContent = "[ LIGHT MODE ]";
        }
        localStorage.setItem('bom_theme', event.data.theme);
    }
});
